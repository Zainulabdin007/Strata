[package]
name = "strata-integration"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
publish = false
description = "Workspace integration tests for Strata"

[dependencies]
dbn = { version = "=0.69.0", default-features = false }
zstd = { workspace = true }
strata-core = { workspace = true }
strata-format = { workspace = true }
strata-codec = { workspace = true }
strata-storage = { workspace = true }
strata-metrics = { workspace = true }
strata-input = { workspace = true }
strata-analyze = { workspace = true }
strata-optimize = { workspace = true }
strata-query = { workspace = true }
serde_json = { workspace = true }
clap = { workspace = true }
proptest = "1"

[[bin]]
name = "strata-crash-writer"
path = "bin/crash_writer.rs"

[[test]]
name = "smoke"
path = "smoke.rs"

