[package]
name = "strata-bench"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
publish = false
description = "Serious Strata benchmark suite (not run by cargo test)"

[[bin]]
name = "strata-bench"
path = "src/main.rs"

[[bin]]
name = "tune-market"
path = "src/bin/tune-market.rs"

[lib]
name = "strata_bench"
path = "src/lib.rs"

[features]
default = ["parquet"]
# Fair columnar baseline (Apache Parquet + Zstd via arrow/parquet).
parquet = ["dep:parquet", "dep:arrow-array", "dep:arrow-schema"]

[dependencies]
strata-input = { workspace = true }
strata-analyze = { workspace = true }
sha2 = "0.10"
strata-optimize = { workspace = true }
toml = { workspace = true }
strata-core = { workspace = true }
strata-codec = { workspace = true }
strata-storage = { workspace = true }
strata-metrics = { workspace = true }
strata-query = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
csv = { workspace = true }
parquet = { version = "53", optional = true, default-features = false, features = ["zstd", "arrow"] }
arrow-array = { version = "53", optional = true }
arrow-schema = { version = "53", optional = true }
