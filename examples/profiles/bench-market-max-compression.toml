logical_type = "timestamp"
nullable = false
unit = "nanoseconds"
encoding = ["delta_of_delta", "zigzag", "bitpack"]

[[columns]]
name = "sequence"
logical_type = "unsigned_integer"
nullable = false
width = "bits64"
encoding = ["delta", "zigzag", "bitpack"]

[[columns]]
name = "order_id"
logical_type = "unsigned_integer"
nullable = false
width = "bits64"
encoding = ["delta", "zigzag", "varint"]

[[columns]]
