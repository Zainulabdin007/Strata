
name = "bench-market"
input_format = "csv"

[input]
recursive = true
extensions = ["csv"]

[schema]
id = "bench_market_events"
description = "strata-bench market generator schema"

[[columns]]
name = "timestamp"
logical_type = "timestamp"
unit = "nanoseconds"
nullable = false
encoding = ["plain"]

[[columns]]
name = "sequence"
logical_type = "unsigned_integer"
width = "bits64"
nullable = false
encoding = ["plain"]

[[columns]]
name = "order_id"
logical_type = "unsigned_integer"
width = "bits64"
nullable = false
encoding = ["plain"]

[[columns]]
name = "symbol"
logical_type = "categorical_string"
max_bytes = 8
nullable = false
encoding = ["plain"]

[[columns]]
name = "price"
logical_type = "fixed_decimal"
precision = 18
scale = 4
width = "bits64"
nullable = false
encoding = ["plain"]

[[columns]]
name = "quantity"
logical_type = "unsigned_integer"
width = "bits32"
nullable = false
encoding = ["plain"]

[[columns]]
name = "side"
logical_type = "enum"
variants = ["buy", "sell"]
nullable = false
encoding = ["plain"]

[[columns]]
name = "event_type"
logical_type = "enum"
variants = ["new", "cancel", "fill", "replace"]
nullable = false
encoding = ["plain"]

[block]
row_count = 65536

[segment]
target_size_bytes = 268435456

[compression]
codec = "none"
level = 3